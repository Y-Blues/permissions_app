title: Assign a role
fields:
  - name: account
    label: User (account identifier)
    required: true
  - name: role
    label: Role (identifier)
    required: true
  - name: organization
    label: "Tenant (organization; \"system\" for a global role, e.g. admin)"
    required: true
actions:
  - name: submit
    label: Assign
    endpoint:
      service: roleAccount
      method: POST
