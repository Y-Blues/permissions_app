[project]
name = "ycappuccino-permissions"
version = "0.1.0"
description = "YCappuccino permissions_app: accounts, roles, organizations, JWT authentication and authorization"
requires-python = ">=3.10"
dependencies = [
    "ycappuccino-api",
    "ycappuccino-core",
    "ycappuccino-storage",
    "ycappuccino-endpoints-storage",
    "ycappuccino-endpoints-service",
    "pyjwt>=2.8",
    "ycappuccino-ui",
    "ycappuccino-ui-shell",
    "ycappuccino-ui-web",
    "ycappuccino-client",
]

[dependency-groups]
# the storage and backend processes of example/three_processes, started by its end-to-end test
dev = [
    "ycappuccino-http-server",
    "ycappuccino-remote",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.permissions"
module-root = "src/main/python"

[tool.uv.sources]
ycappuccino-api = { path = "../api", editable = true }
ycappuccino-core = { path = "../core", editable = true }
ycappuccino-storage = { path = "../storage", editable = true }
ycappuccino-endpoints-storage = { path = "../endpoints_storage", editable = true }
ycappuccino-endpoints-service = { path = "../endpoints_service", editable = true }
ycappuccino-ui = { path = "../ui", editable = true }
ycappuccino-ui-shell = { path = "../ui_shell", editable = true }
ycappuccino-ui-web = { path = "../ui_web", editable = true }
ycappuccino-client = { path = "../client", editable = true }
ycappuccino-http-server = { path = "../http_server", editable = true }
ycappuccino-remote = { path = "../remote", editable = true }
