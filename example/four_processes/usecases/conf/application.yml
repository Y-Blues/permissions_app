---
# process 2 -- use cases: Manager, CRUD and service use cases, permissions (login, authorization, bootstrap).
# No storage layer is active: its IStorage is a proxy to the storage process. Only the HTTP adapter calls it,
# signed, on behalf of the signed-in user.
name: usecases
bundle_prefix:
  - ycappuccino.storage
  - ycappuccino.endpoints_storage
  - ycappuccino.endpoints_service
  - ycappuccino.http_server
  - ycappuccino.permissions
  - ycappuccino.remote.dispatch
  - ycappuccino.remote.capabilities
  - ycappuccino.remote.configured_peers
  - ycappuccino.remote.peer_authentication
  - ycappuccino.remote.component_directory
components:
  JwtAuthentication:
    key: demo-secret-key-not-for-production-use
  PasswordLogin:
    key: demo-secret-key-not-for-production-use
  FrontendShell:
    key: demo-secret-key-not-for-production-use
  ConfiguredPeers:
    peers: "storage=http://localhost:8301, http"
    secret: "change-me-secret-shared-by-the-four-processes"
  ComponentDirectory:
    specifications: "ycappuccino.api.storage.IStorage"
    refresh: 2.0
config:
  http_server:
    active: true
    port: 8302
    ip: localhost
  shell:
    console: false
